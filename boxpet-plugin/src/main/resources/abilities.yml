# BoxPet — kỹ năng của pet (BOXPET_SPEC 6). Mỗi pet có tối đa 1 kỹ năng, mỗi kỹ năng tối đa 1 buff + 1 debuff.
# Giá trị theo cấp và độ hiếm: (base + per-level × (cấp - 1)) × stat-multiplier của độ hiếm.
#
# type:
#   projectile  bắn đạn (model VFX bay theo mục tiêu), trúng thì gây sát thương + debuff
#   strike      đánh thẳng vào mục tiêu, hiện VFX tại mục tiêu
#   mark        đánh dấu mục tiêu: đòn đánh thật của chủ lên nó mạnh hơn bonus-percent %
#   heal        hồi máu cho chủ khi máu dưới below-percent %
#   shield      khi máu chủ dưới below-percent %: khiên hấp thụ (hearts tim) trong seconds giây
#   potion      giữ 1 hiệu ứng tốt cho chủ (amplifier-by-rarity: cấp hiệu ứng theo độ hiếm, 0 = cấp I)
#   meteor      (0.8.0) thiên thạch rơi quanh mục tiêu sau warn-ticks (né được): meteor.count / spread / warn-ticks, area.radius
#   buff        (0.8.0) tăng chỉ số MMOItems cho riêng chủ nhân trong buff.seconds giây. trigger: combat (khi giao tranh),
#               hurt (khi chủ bị đánh), low-hp (khi máu chủ dưới buff.below-percent %). enemy-stat: lấy chỉ số của
#               người địch (mục tiêu / kẻ vừa đánh, hoặc mọi kẻ địch trong radius ô); debuff: lên kẻ vừa đánh / mục tiêu
#   boost       cộng hệ số BoxCore (mining / quest / mob) theo phần mười (tenths: 5 = +x0,5); whole: true = chỉ số nguyên
# Thêm (0.8.0): area.radius (nổ trúng mọi kẻ địch quanh chỗ trúng), chain (targets / range / ratio: bật sang mục tiêu
#   khác, mỗi lần còn ratio sát thương), pierce: true (đâm xuyên cả hàng), hits (count / interval-ticks: đánh nhiều lần),
#   heal + shield (hồi máu kèm khiên), shield + blast (radius / power: đẩy lùi kẻ địch khi khiên bật).
#   Hạ mob và đào mỏ chỉ nhận hệ số chẵn (x2, x3).
#   %radius% %chain% %hits% %count% %buff% %buff_stat% %enemy% %enemy_stat% %debuff_seconds%
# Kỹ năng chiến đấu chỉ dùng khi chủ đang giao tranh, chỉ đánh người chủ vừa đánh hoặc người vừa đánh chủ.
# Sát thương tính là đòn kỹ năng của chủ (MythicLib SKILL + MAGIC). pvp-multiplier: sát thương lên người chơi
# (thiếu thì dùng abilities.pvp-multiplier trong config.yml), pve-multiplier: lên mob.
# debuff.type: burn, slow, bleed (damage-ratio × sát thương mỗi giây), weakness
# fx: animation (tên hoạt ảnh của pet, mặc định skill), sounds (delay tính bằng tick), particles (at: pet, target, owner, path),
#     vfx: model ModelEngine (model, animation, speed ô/tick, life-ticks, scale, y-offset)
# name / color: tên kỹ năng và màu (hex hoặc gradient '#A:#B').
# description: mô tả, các số tự tô màu (menus.yml ability-numbers) và tăng theo cấp độ; hồi chiêu tự hiện ở dòng riêng.
#   %damage% %heal% %hearts% %percent% %bonus% %boost% %boost_type% %seconds% %potion% %level% %range% %pvp%
abilities:
  fire_ball_fire:
    type: projectile
    name: 'Cầu Lửa'
    color: '#FF7A45:#FFC15E'
    description:
      - 'Phun cầu lửa vào mục tiêu,'
      - 'gây %damage% sát thương và đốt'
      - 'cháy %seconds% giây'
