# BoxPet — config.yml
# Mọi giá trị đều có mặc định trong plugin: thiếu dòng nào thì dùng mặc định, nâng cấp chỉ cần thay jar.

storage:
  # sqlite (file plugins/BoxPet/data.db) hoặc mysql
  type: sqlite
  sqlite-file: data.db
  mysql:
    host: localhost
    port: 3306
    database: boxpet
    user: root
    password: ''
    params: 'useSSL=false&characterEncoding=utf8'
  # lưu dữ liệu người chơi đã thay đổi mỗi bao nhiêu giây (luôn lưu khi thoát)
  save-interval-seconds: 60

# Màu chung của tin nhắn và menu (giống BoxCore): <text> <muted> <accent> <success> <error>
style:
  palette:
    text: '#FFFFFF'
    muted: '#C8C8C8'
    accent: '#FFD166'
    success: '#7CFC9A'
    error: '#FF6B6B'

# Giao tranh: bị đánh hoặc đánh ai trong N giây gần nhất
combat-tag-seconds: 10
# đang mở menu BoxPet mà vào giao tranh thì đóng menu
close-menu-on-combat: true
# chờ bao nhiêu giây giữa 2 lần thả / đổi pet
swap-cooldown-seconds: 10
# ẩn pet khi chủ có hiệu ứng tàng hình
hide-when-invisible: true

storage-slots:
  # kho pet mặc định; thêm bằng quyền boxpet.storage.<số>
  default: 20
  max: 200

incubator:
  # ô ấp mặc định; thêm bằng quyền boxpet.incubator.<số> (tối đa max-slots, không quá 7)
  default-slots: 1
  max-slots: 5
  # ấp ngay: số gem cho mỗi phút còn lại (0 = tắt)
  gem-per-minute: 1

menu:
  click-cooldown-ticks: 4
  input-timeout-seconds: 30

visibility:
  # khoảng cách nhìn thấy pet (ô). Thấp hơn = ít người nhận gói tin của mỗi pet, nhẹ server và mạng
  view-distance: 24
  # mỗi người chơi thấy tối đa bao nhiêu pet của người khác (gần nhất trước), pet của mình luôn thấy
  max-visible-per-player: 10
  # tên trên đầu pet. %name% %level% %hungry%
  nametag: '%name% <dark_gray>[<gray>Lv.%level%<dark_gray>]%hungry%'
  nametag-offset: 0.35
  # di chuyển tên trên đầu pet mỗi bao nhiêu tick (có nội suy nên vẫn mượt); 1 = mỗi tick, tốn gói tin nhất
  nametag-update-ticks: 3

# Vị trí và cách đi theo (BOXPET_SPEC 4.1). Mỗi pet có thể ghi đè side / back / height / fly trong file pet.
follow:
  # sau lưng bên phải: lệch phải side ô, lùi back ô (số âm = bên trái)
  side: 1.2
  back: 0.8
  height: 0.0
  # pet bay lơ lửng cao hơn chân chủ bấy nhiêu ô
  fly-height: 1.0
  # chủ ra xa hơn bao nhiêu ô thì pet mới bắt đầu đi theo
  start-distance: 3.0
  # xa hơn bao nhiêu ô thì pet biến mất và hiện lại cạnh chủ
  teleport-distance: 12.0
  # tốc độ tối đa (ô mỗi tick)
  max-speed: 0.9
  fly-max-speed: 1.5
  # chủ đứng yên bao lâu thì pet đi loanh quanh, trong bán kính bao nhiêu ô
  wander-after-seconds: 10
  wander-radius: 2.0
  # chủ nhìn thẳng vào pet bao lâu thì pet phản ứng
  look-react-seconds: 2.0
  look-react-cooldown-seconds: 60
  # Ngồi yên: chủ đi xa hơn bao nhiêu ô thì pet tự đi theo
  sit-max-distance: 15.0
  combat:
    # pet lọt vào vùng nhìn phía trước (độ) và gần hơn near-distance ô thì bay lên trên đầu
    view-cone-degrees: 60
    near-distance: 4.0
    rise: 1.4
    # giữ chế độ giao tranh thêm bao nhiêu giây sau khi hết giao tranh
    end-seconds: 0

# Di chuyển nhanh (BOXPET_SPEC 4.5): elytra, cưỡi thú, riptide, chạy nhanh hơn speed ô/giây
fast-travel:
  speed: 9.0
  sustain-ticks: 20
  # chủ chậm lại / đáp xuống bao nhiêu tick thì pet hiện ra
  land-ticks: 30

appear:
  after-teleport-ticks: 5
  after-respawn-ticks: 20
  after-join-ticks: 20

# Thân thiết 0-100 (BOXPET_SPEC 11.2)
bond:
  start: 50
  # vuốt ve: +pet-gain, chỉ 1 lần mỗi pet-cooldown-minutes phút
  pet-gain: 5
  pet-cooldown-minutes: 240
  # thân thiết tối đa nhận từ thức ăn mỗi ngày
  food-max-per-day: 5
  # không vuốt ve quá neglect-hours giờ thì -neglect-decay, và cứ thêm mỗi neglect-hours giờ lại trừ tiếp
  neglect-hours: 24
  neglect-decay: 5
  # chỉ số pet theo mức thân thiết (stats = % chỉ số)
  tiers:
    attached:
      min: 90
      name: 'Gắn bó'
      stats: 110
    close:
      min: 60
      name: 'Thân thiết'
      stats: 100
    normal:
      min: 30
      name: 'Bình thường'
      stats: 90
    distant:
      min: 0
      name: 'Xa cách'
      stats: 75

# Độ no 0-100 (BOXPET_SPEC 11.3): thức ăn và kẹo dùng chung một bụng
fullness:
  start: 50
  # thả pet ra, mỗi bao nhiêu phút mất 1 điểm no (6 phút = 10 giờ từ 100 về 0)
  drain-minutes-per-point: 6
  # dưới mức này pet nhắc "hơi đói"
  little-hungry-below: 30

abilities:
  # sát thương kỹ năng pet lên người chơi so với lên mob (mỗi kỹ năng có thể ghi đè)
  pvp-multiplier: 0.6
  # đòn pet có đẩy lùi mục tiêu không (false = không, để pet không đẩy kẻ địch ra khỏi combo của chủ)
  knockback: false

rename:
  min-length: 3
  max-length: 16
  cooldown-seconds: 30
  banned-words: []

pet-chat:
  cooldown-seconds: 20
  idle-min-seconds: 600
  idle-max-seconds: 1200
  # bong bóng chữ trên đầu pet (chỉ chủ thấy)
  speech-bubble: true
  speech-bubble-ticks: 60
  hungry-repeat-seconds: 600
  owner-low-hp-percent: 30
  owner-low-hp-cooldown-seconds: 60
  # các ngày tuổi pet nói câu sinh nhật
  birthdays: [7, 30, 100, 365]

release:
  # thả pet thì trả lại 1 kẹo (mã trong items.yml), '' = không trả
  refund-candy: ''
