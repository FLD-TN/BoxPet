# BoxPet — độ hiếm, xếp từ thấp tới cao (BOXPET_SPEC 3.1). Từ 0.5.0 mỗi pet có đúng 1 độ hiếm (rarity trong file pet).
#   color / gradient-to  màu tên độ hiếm (gradient-to trống = một màu)
#   stat-multiplier      nhân chỉ số, kỹ năng và boost: độ hiếm càng cao, chỉ số gốc càng cao
#   max-level            cấp tối đa
#   hatch-time           thời gian ấp trứng (10m, 1h30m, 2h...)
#   collection-points    điểm bộ sưu tập khi sở hữu một pet có độ hiếm này
rarities:
  common:
    name: 'Thường'
    color: '#9DB5A8'
    gradient-to: ''
    stat-multiplier: 1.0
    max-level: 30
    hatch-time: 10m
    collection-points: 1
  rare:
    name: 'Hiếm'
    color: '#4FD1C5'
    gradient-to: '#9BF0E1'
    stat-multiplier: 1.4
    max-level: 40
    hatch-time: 30m
    collection-points: 2
  epic:
    name: 'Sử thi'
    color: '#A97CF8'
    gradient-to: '#F3A6FF'
    stat-multiplier: 1.9
    max-level: 50
    hatch-time: 1h
    collection-points: 3
  legendary:
    name: 'Huyền thoại'
    color: '#FF8A3D'
    gradient-to: '#FFE27A'
    stat-multiplier: 2.5
    max-level: 60
    hatch-time: 2h
    collection-points: 5
