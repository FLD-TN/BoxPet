# ------------------------------------------------------------------ thẻ pet

pet-card:
  name: '%name%'
  lore:
    - ''
    - '<#FFD166>Thông tin:'
    - '<gray>• Độ hiếm: %rarity%'
    - '<gray>• Loại: %role%'
    - ''
    - '<#FFD166>Phát triển:'
    - '<gray>• Cấp độ: %level%'
    - '<gray>• EXP: %xp_bar% %xp%'
    - ''
    - '<#FFD166>Tình trạng:'
    - '<gray>• Thân thiết: %bond_bar% %bond_colour%%bond%'
    - '<gray>• Độ no: %fullness_bar% %fullness_colour%%fullness%'
    - '<gray>• Tuổi: <white>%age%'
    - ''
    - '<#FFD166>Chỉ số cộng thêm:'
    - '%stats%'
    - ''
    - '%ability%'
    - ''
    - '%warning%'
    - ''
    - '%status%'
    - ''
    - '%actions%'
  xp-value: '<white>%xp%<gray>/%need%'
  xp-max: '<#FFD166>Đã tối đa'
  xp-breakthrough: '<#FF9F5A>Cần đột phá'
  # EXP dư khi đầy mốc, được cộng vào cấp sau khi đột phá thành công
  xp-breakthrough-extra: '<#FF9F5A>Cần đột phá <dark_gray>(<gray>dư <#7CFC9A>%extra% EXP<dark_gray>)'
  level-inline: '<gray>Cấp độ: %level%'
  stat-row: '<gray>• %stat%: <white>%value%'
  no-stats: '<gray>• Không có'
  # dòng đầu của kỹ năng: Kỹ năng: <tên kỹ năng>
  ability-header: '<#FFD166>Kỹ năng: %ability%'
  # dòng mô tả đầu có dấu •, các dòng sau thụt vào 1 khoảng trắng
  ability-line-first: '<gray>• <#BFC7D5>%line%'
  ability-line: '  <#BFC7D5>%line%'
  ability-cooldown: '<gray>• Hồi chiêu: <#7FDBFF>%value% giây'
  # dòng cảnh báo dưới kỹ năng (%warning%), tự canh giữa
  warning: '<#FF4D4D>(!) Pet đói sẽ mất chỉ số và kỹ năng (!)'
  no-ability: '<#FFD166>Kỹ năng: <gray>không có'
  # thêm sau tên pet khi đang được thả
  name-active: ' <dark_gray>[<#7CFC9A>Đang được thả<dark_gray>]'
  status-hungry: '<#FF4D4D>✘ Đang đói: không có chỉ số và kỹ năng'
  unknown-type: '<#FF8A8A>Loại pet này không còn tồn tại'

actions:
  manage: '<dark_gray>[<#7CFC9A>Chuột trái để quản lý<dark_gray>]'
  shift-dismiss: '<dark_gray>[<#FF8A8A>Shift + chuột trái để cất pet<dark_gray>]'
  quick-summon: '<dark_gray>[<#7FDBFF>Chuột phải để thả pet<dark_gray>]'
  quick-dismiss: '<dark_gray>[<#FF8A8A>Chuột phải để cất pet<dark_gray>]'
  admin-manage: '<dark_gray>[<#7CFC9A>Chuột trái để quản lý<dark_gray>]'
  feed-one: '<dark_gray>[<#7CFC9A>Chuột trái để cho ăn 1 cái<dark_gray>]'
  feed-all: '<dark_gray>[<#7FDBFF>Shift + chuột trái để ăn tới khi no<dark_gray>]'
