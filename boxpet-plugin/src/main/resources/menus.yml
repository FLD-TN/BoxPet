# BoxPet — menus.yml: tiêu đề, nút và lore của các menu.
# Chuẩn GUI BoxCore: tên không in đậm, dòng mô tả <#BFC7D5>, mục <#FFD166>Tên mục:, dòng "• Nhãn: giá trị",
# dòng thao tác ở cuối <dark_gray>[<#7CFC9A>Chuột trái để ...<dark_gray>].
# Một dòng lore chỉ có %tên% (ví dụ %stats%) được thay bằng nhiều dòng.

roles:
  combat: '<#FF7A7A>Chiến đấu'
  support: '<#6EE7B7>Hỗ trợ'
  boost: '<#FFC857>Kinh tế'

boost-types:
  mining: 'khi đào mỏ'
  quest: 'thưởng nhiệm vụ'
  mob: 'khi hạ mob, boss'

fullness-states:
  full: 'No căng'
  fed: 'No'
  little-hungry: 'Hơi đói'
  hungry: '<#FF8A8A>Đói'

state:
  'on': '<#7CFC9A>✔ Bật'
  'off': '<#FF8A8A>✘ Tắt'

# Màu số cấp độ theo từng mốc 10 cấp: 1-9, 10-19, 20-29, 30-39, 40-49, 50-59, 60+
level-colors:
  - '#D6DEE7'
  - '#8EE68E'
  - '#5AD8E6'
  - '#6F9BFF'
  - '#B67CFF'
  - '#FF73C0'
  - '#FF9A3C'

