# BoxPet — bộ sưu tập (BOXPET_SPEC 9.4)
# Mỗi loại pet từng ấp được cho điểm theo độ hiếm cao nhất (rarities.yml collection-points).
# Đủ điểm thì nhận chỉ số MMOItems vĩnh viễn, cộng dồn các mốc đã đạt, kể cả khi không thả pet.
milestones:
  m10:
    score: 10
    label: 'Người nuôi pet'
    stats:
      DEFENSE: 1
  m25:
    score: 25
    label: 'Người sưu tầm'
    stats:
      MAX_HEALTH: 2
  m50:
    score: 50
    label: 'Nhà sưu tầm'
    stats:
      CRITICAL_STRIKE_CHANCE: 1
  m100:
    score: 100
    label: 'Bậc thầy thú cưng'
    stats:
      ATTACK_DAMAGE: 1
      MAX_HEALTH: 2
