# BoxPet — bộ sưu tập
# Mỗi loại pet từng có trong kho (cho ăn, tương tác được) tính 1. Thả pet đi vẫn giữ.
# Đủ số loại thì nhận chỉ số MMOItems vĩnh viễn, cộng dồn các mốc đã đạt, kể cả khi không thả pet.
#   count   số loại pet cần có
milestones:
  m5:
    count: 5
    label: 'Người nuôi pet'
    stats:
      DEFENSE: 1
  m15:
    count: 15
    label: 'Người sưu tầm'
    stats:
      MAX_HEALTH: 2
  m30:
    count: 30
    label: 'Nhà sưu tầm'
    stats:
      CRITICAL_STRIKE_CHANCE: 1
  m45:
    count: 45
    label: 'Bậc thầy thú cưng'
    stats:
      ATTACK_DAMAGE: 1
      MAX_HEALTH: 2
