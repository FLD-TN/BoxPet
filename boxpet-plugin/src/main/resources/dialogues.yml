# BoxPet — pet nói chuyện với chủ nhân (BOXPET_SPEC 11.4). Chỉ chủ nhân thấy.
# Xưng hô: pet tự xưng "mình", gọi người chơi là "chủ nhân"; pet là bạn đồng hành, không phải người hầu.
# %pet% tên pet, %owner% tên chủ nhân, %level% cấp độ, %age% số ngày tuổi (sinh nhật)
# default: câu chung của mọi pet.
# families.<họ pet>: câu riêng của một họ (họ = "family" trong file pet). Câu riêng được trộn chung với câu chung,
# nên pet vừa có câu riêng vừa có câu chung.
format: '<#FFB3C7>%pet%<dark_gray>: <white>%line%'
bubble-format: '<white>%line%'

