name: BoxPet
version: '${version}'
main: com.dex.boxpet.BoxPetPlugin
api-version: '1.21'
author: dex
description: Thú cưng 3D (ModelEngine) cộng chỉ số MMOItems, chiến đấu, hỗ trợ, tăng boost
depend: [ModelEngine, MythicLib]
softdepend: [BoxCore, BoxClans, WorldGuard, PlaceholderAPI, Vault, ItemsAdder, CataMines, BoxQuest, MyBoxMobs, MMOItems]

commands:
  pet:
    description: Menu thú cưng
    usage: /pet [dismiss|hideothers|chat|thongbao|rename|chedo|muctieu|xem]
    aliases: [pets, thucung]
  boxpet:
    description: Quản lý BoxPet
    usage: /boxpet <give|pets|transfer|set|delete|restore|incubator|models|reload>
    permission: boxpet.admin

permissions:
  boxpet.use:
    description: Dùng /pet
    default: true
  boxpet.rename:
    description: Đặt tên cho pet
    default: true
  boxpet.admin:
    description: Lệnh /boxpet
    default: op
    children:
      boxpet.bypass: true
  boxpet.bypass:
    description: Bỏ qua khoá giao tranh (mở menu, bấm pet, gọi / cất / đổi pet) và thời gian chờ đổi pet, đổi tên, khoe
    default: op
