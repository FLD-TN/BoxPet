# Rồng Lửa Linh Hồn (fire_dragon) — file mẫu, chỉnh tự do. Xoá file = xoá loại pet khỏi server (pet đã có vẫn ở trong DB).
name: 'Rồng Lửa Linh Hồn'
# họ pet: nhóm trong bộ sưu tập và bộ câu thoại riêng (dialogues.yml families)
family: fire_dragon
# combat (chiến đấu), support (hỗ trợ), boost (kinh tế)
role: combat
description:
  - 'Rồng lửa nhỏ, phun cầu lửa'
  - 'vào kẻ địch của chủ'
# icon ItemsAdder của pack (namespace:id); không có ItemsAdder thì dùng icon-fallback
icon: 'companions_1:icon_fire_dragon_soulfire'
icon-fallback: DRAGON_HEAD
# độ hiếm trứng của pet này có thể có
rarities: [common, rare, epic, legendary]
# tỉ lệ ra từ Trứng Ngẫu Nhiên (0 = không bao giờ ra)
egg-weight: 2
# bậc tiến hóa: thêm dòng mới (model, min-level, cost-money, cost-gem, stat-multiplier) khi có model bậc sau
stages:
  - model: pet_fire_dragon_soulfire
    scale: 1
animations:
  idle: idle
  walk: walk
  skill: skill
  interact: interact
follow:
  fly: true
carry:
  enabled: true
# chỉ số MMOItems ở cấp 1 và tăng mỗi cấp, trước khi nhân độ hiếm / bậc / thân thiết
stats:
  ATTACK_DAMAGE:
    base: 1
    per-level: 0.05
  CRITICAL_STRIKE_CHANCE:
    base: 0.5
    per-level: 0.02
# kỹ năng trong abilities.yml
ability: fire_ball_soulfire
