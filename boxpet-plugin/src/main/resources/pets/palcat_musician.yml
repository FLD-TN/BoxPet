# Mèo Nhạc Sĩ (palcat) — file mẫu, chỉnh tự do. Xoá file = xoá loại pet khỏi server (pet đã có vẫn ở trong DB).
name: 'Mèo Nhạc Sĩ'
# họ pet: nhóm trong bộ sưu tập và bộ câu thoại riêng (dialogues.yml families)
family: palcat
# combat (chiến đấu), support (hỗ trợ), boost (kinh tế)
role: boost
description:
  - 'Mèo nhạc sĩ vui vẻ,'
  - 'tăng thưởng nhiệm vụ'
# icon ItemsAdder của pack (namespace:id); không có ItemsAdder thì dùng icon-fallback
icon: 'am_fantasypets_palcat:am_icon_palcat_musician'
icon-fallback: IRON_SHOVEL
# độ hiếm trứng của pet này có thể có
rarities: [common, rare, epic, legendary]
# tỉ lệ ra từ Trứng Ngẫu Nhiên (0 = không bao giờ ra)
egg-weight: 2
# bậc tiến hóa: thêm dòng mới (model, min-level, cost-money, cost-gem, stat-multiplier) khi có model bậc sau
stages:
  - model: am_pet_palcat_musician
    scale: 1
animations:
  idle: idle
  walk: walk
  skill: skill1
  interact: int1
follow:
  fly: false
carry:
  enabled: true
# chỉ số MMOItems ở cấp 1 và tăng mỗi cấp, trước khi nhân độ hiếm / bậc / thân thiết
stats:
  MAX_HEALTH:
    base: 1
    per-level: 0.05
  DEFENSE:
    base: 0.4
    per-level: 0.02
# kỹ năng trong abilities.yml
ability: palcat_music
