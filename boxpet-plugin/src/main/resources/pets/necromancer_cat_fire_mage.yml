# Mèo Pháp Sư Lửa (necromancer_cat) — file mẫu, chỉnh tự do. Xoá file = xoá loại pet khỏi server (pet đã có vẫn ở trong DB).
name: 'Mèo Pháp Sư Lửa'
# họ pet: nhóm trong bộ sưu tập và bộ câu thoại riêng (dialogues.yml families)
family: necromancer_cat
# combat (chiến đấu), support (hỗ trợ), boost (kinh tế)
role: combat
description:
  - 'Mèo phù thủy, ném phép'
  - 'vào kẻ địch của chủ'
# icon ItemsAdder của pack (namespace:id); không có ItemsAdder thì dùng icon-fallback
icon: 'companions_2:icon_necromancer_cat_fire_mage'
icon-fallback: BLAZE_POWDER
# độ hiếm trứng của pet này có thể có
rarities: [common, rare, epic, legendary]
# tỉ lệ ra từ Trứng Ngẫu Nhiên (0 = không bao giờ ra)
egg-weight: 2
# bậc tiến hóa: thêm dòng mới (model, min-level, cost-money, cost-gem, stat-multiplier) khi có model bậc sau
stages:
  - model: pet_necromancer_cat_fire_mage
    scale: 1
animations:
  idle: idle
  walk: walk
  skill: skill
  interact: interact
follow:
  fly: false
carry:
  enabled: true
# chỉ số MMOItems ở cấp 1 và tăng mỗi cấp, trước khi nhân độ hiếm / bậc / thân thiết
stats:
  SKILL_DAMAGE:
    base: 1
    per-level: 0.05
  ATTACK_DAMAGE:
    base: 0.6
    per-level: 0.03
# kỹ năng trong abilities.yml
ability: necro_fireball
