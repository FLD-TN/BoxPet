# Tinh Linh Gió (cubee_dragon) — file mẫu, chỉnh tự do. Xoá file = xoá loại pet khỏi server (pet đã có vẫn ở trong DB).
name: 'Tinh Linh Gió'
# màu tên mặc định: một mã hex ('#FF7A45') hoặc gradient ('#FFF1A8:#FFB347')
color: '#E6FAFF'
# họ pet: nhóm trong thư viện và bộ câu thoại riêng (dialogues.yml families)
family: cubee_dragon
# combat (chiến đấu), support (hỗ trợ), boost (kinh tế)
role: boost
# độ hiếm của pet này (một model = một pet = một độ hiếm). Độ hiếm cao hơn thì chỉ số gốc cao hơn
rarity: common
# icon ItemsAdder của pack (namespace:id); không có ItemsAdder thì dùng icon-fallback
icon: 'cubees:cubees-icon-air_dragon'
icon-fallback: DRAGON_EGG
# tỉ lệ ra từ Trứng Ngẫu Nhiên cùng độ hiếm (0 = không bao giờ ra)
egg-weight: 2
# bậc tiến hóa: thêm dòng mới (model, min-level, cost-money, cost-gem, stat-multiplier) khi có model bậc sau
stages:
  - model: cubee-air_dragon
    scale: 0.6
animations:
  idle: idle
  walk: walk
  skill: execute
  interact: pet
  pet: pet
follow:
  fly: false
# chỉ số MMOItems ở cấp 1 và tăng mỗi cấp, rồi nhân stat-multiplier của độ hiếm, bậc tiến hóa và thân thiết
stats:
  PVE_DAMAGE:
    base: 1
    per-level: 0.05
  MAX_HEALTH:
    base: 1
    per-level: 0.05
# kỹ năng trong abilities.yml
ability: cubee_wind_hunt
